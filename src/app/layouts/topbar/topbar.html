<nav class="topbar">

  <div class="topbar-left">
    <a routerLink="/dashboard" class="brand">
      <img src="assets/logo-menu-light.png" alt="Logo Optiva CRM" class="brand-image brand-image-light" />
      <img src="assets/logo-menu.png" alt="" aria-hidden="true" class="brand-image brand-image-dark" />
      <!-- <span class="brand-logo">O</span>
      <span class="brand-name">Optiva<span class="brand-accent"> CRM</span></span> -->
    </a>
  </div>

  <nav class="topbar-nav" aria-label="Navegação principal">
    <a *ngFor="let item of menuItems" [routerLink]="item.link" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: item.link === '/dashboard' }" class="topbar-nav-item">
      <mat-icon>{{ item.icon }}</mat-icon><span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="topbar-right">

    <button mat-icon-button class="notif-btn" aria-label="Notificações">
      <mat-icon>notifications_none</mat-icon>
      <span class="notif-dot" *ngIf="hasNotifications"></span>
    </button>

    <button mat-button class="user-btn" [matMenuTriggerFor]="userMenu">
      <span class="user-identity">
        <span class="avatar">{{ initials }}</span>
        <span class="user-name">{{ userName }}</span>
      </span>
      <mat-icon class="user-caret">expand_more</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="user-menu-head">
        <span class="avatar avatar-lg">{{ initials }}</span>
        <div class="user-menu-info">
          <span class="user-menu-name">{{ userName }}</span>
          <span class="user-menu-email">{{ userEmail }}</span>
        </div>
      </div>

      <button mat-menu-item [matMenuTriggerFor]="themeMenu" aria-label="Selecionar tema">
        <mat-icon>palette</mat-icon>
        <span>Aparência: {{ themeLabel }}</span>
      </button>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>


    <mat-menu #themeMenu="matMenu" xPosition="before">
      <button mat-menu-item (click)="setTheme('light')">
        <mat-icon>{{ themeService.theme === 'light' ? 'check' : '' }}</mat-icon><span>Padr&#227;o</span>
      </button>
      <button mat-menu-item (click)="setTheme('white')">
        <mat-icon>{{ themeService.theme === 'white' ? 'check' : '' }}</mat-icon><span>Branco</span>
      </button>
      <button mat-menu-item (click)="setTheme('dark')">
        <mat-icon>{{ themeService.theme === 'dark' ? 'check' : '' }}</mat-icon><span>Escuro VS Code</span>
      </button>
      <button mat-menu-item (click)="setTheme('blue')">
        <mat-icon>{{ themeService.theme === 'blue' ? 'check' : '' }}</mat-icon><span>Azul</span>
      </button>
    </mat-menu>
  </div>

</nav>
