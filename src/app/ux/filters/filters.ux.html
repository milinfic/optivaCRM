<div class="filters-container">
  <form class="filters-form" [formGroup]="form" (submit)="$event.preventDefault()">
    <div class="form-row" [style.--filter-columns]="fields.length">
      <div class="field" *ngFor="let field of fields">
        <label [attr.for]="controlId(field)">{{ field.label }}</label>

        <input
          *ngIf="field.type === 'text'"
          [id]="controlId(field)"
          class="field-control"
          type="text"
          [formControlName]="field.name"
          [placeholder]="field.placeholder || ''">

        <select
          *ngIf="field.type === 'select'"
          [id]="controlId(field)"
          class="field-control"
          [formControlName]="field.name">
          <option *ngFor="let option of field.options || []" [ngValue]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-row-button">
      <button mat-button class="btn-clear" type="button" (click)="clearFilters()">
        <mat-icon>cleaning_services</mat-icon>
        Limpar
      </button>

      <div class="form-row-actions">
        <ng-content select="[filtersActions]"></ng-content>

        <app-btn-primary title="Filtrar" icon="filter_alt" (clicked)="apply.emit()">
          <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
        </app-btn-primary>
      </div>
    </div>
  </form>
</div>
